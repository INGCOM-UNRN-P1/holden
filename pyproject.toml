[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holden"
version = "0.2.0"
description = "Generador de mocks e inyección controlada de fallos en funciones C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@e4c8e1050e5dd87a930c5404aba6b65d1be1665a",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/holden"
Repository = "https://github.com/INGCOM-UNRN-P1/holden.git"
Issues = "https://github.com/INGCOM-UNRN-P1/holden/issues"

[project.scripts]
holden = "holden.cli:main"

[project.entry-points."ripley.plugins"]
mocks = "holden.ripley_plugin:HoldenPlugin"

[dependency-groups]
# PEP 735: uv lo instala con un `uv sync` a secas; como extra opcional hacía falta
# `--extra dev` y sin eso `.venv/bin/python -m pytest` no encontraba pytest.
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/holden"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
# yutani es una referencia directa a git (nunca por nombre en PyPI).
allow-direct-references = true
