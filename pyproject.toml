[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holden"
version = "0.1.0"
description = "Generador de mocks e inyección controlada de fallos en funciones C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
holden = "holden.cli:main"

[project.entry-points."ripley.plugins"]
mocks = "holden.ripley_plugin:HoldenPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/holden"]

[tool.pytest.ini_options]
pythonpath = ["src"]
